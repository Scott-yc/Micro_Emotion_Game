<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Uid')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-uid" data-rule="required" class="form-control" name="row[uid]" type="number" value="{$row.uid|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Skin_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-skin_id" data-rule="required" data-source="skin/index" class="form-control selectpage" name="row[skin_id]" type="text" value="{$row.skin_id|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Access')}:</label>
        <div class="col-xs-12 col-sm-8">
                        
            <select  id="c-access" data-rule="required" class="form-control selectpicker" name="row[access]">
                {foreach name="accessList" item="vo"}
                    <option value="{$key}" {in name="key" value="$row.access"}selected{/in}>{$vo}</option>
                {/foreach}
            </select>

        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
